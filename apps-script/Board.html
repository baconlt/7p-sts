<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7P Beach Assignments</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',sans-serif;background:linear-gradient(150deg,#b8d4f0 0%,#7fb3e8 100%);min-height:100vh;padding:20px 16px 40px}
    .top{text-align:center;margin-bottom:20px}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:1.65rem;font-weight:800;letter-spacing:.4px;color:#0d2137;margin-bottom:10px}
    .date-row{display:flex;align-items:center;justify-content:center;gap:8px}
    .date-row label{font-size:.85rem;font-weight:600;color:#1e3a5f}
    input[type=date]{padding:5px 11px;border-radius:8px;border:1.5px solid #57a0d3;font-family:'Barlow',sans-serif;font-size:.9rem;background:#fff;color:#0d2137;cursor:pointer}
    .officer-card{background:rgba(255,255,255,.8);border-radius:12px;padding:11px 18px;margin-bottom:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);font-size:.95rem}
    .officer-label{font-weight:700;color:#1e3a5f}
    .posts-grid{display:flex;flex-wrap:wrap;gap:14px}
    .post-card{flex:1 1 0;min-width:120px;border-radius:16px;padding:16px 14px;box-shadow:0 3px 12px rgba(0,0,0,.15);text-align:center}
    .post-name{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
    .guard-name{font-size:.93rem;padding:2px 0}
    .empty{text-align:center;color:#1e3a5f;font-size:1rem;margin-top:40px;opacity:.8;background:rgba(255,255,255,.6);border-radius:12px;padding:30px}
    .loading{text-align:center;color:#1e3a5f;padding:40px;font-size:1rem;opacity:.7}
    .refresh-note{text-align:center;font-size:.7rem;color:#4a7a9a;margin-top:18px}
  </style>
</head>
<body>
  <div class="top">
    <h1 id="title">🏖 Beach Assignments</h1>
    <div class="date-row">
      <label for="dp">Date:</label>
      <input type="date" id="dp" onchange="loadBoard(this.value)">
    </div>
  </div>
  <div id="officer-section"></div>
  <div id="board" class="loading">Loading…</div>
  <div class="refresh-note">Auto-refreshes every 5 minutes</div>

  <script>
    let RANK_COLORS={};
    function today(){
      const d=new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
    function fmtDate(ds){
      const d=new Date(ds+'T12:00:00');
      return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    }
    function textColor(hex){
      const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      return (r*0.299+g*0.587+b*0.114)/255>0.55?'#1a1a1a':'#fff';
    }
    function rankChip(o){
      const hex=RANK_COLORS[o.rank]||'#94a3b8';
      const rv=parseInt(hex.slice(1,3),16),gv=parseInt(hex.slice(3,5),16),bv=parseInt(hex.slice(5,7),16);
      return`<span style="display:inline-block;background:rgba(${rv},${gv},${bv},.15);border:1px solid rgba(${rv},${gv},${bv},.4);color:${hex};padding:3px 11px;border-radius:20px;font-size:.8rem;font-weight:600;white-space:nowrap">${o.name}</span>`;
    }
    function guardChip(o){
      const hex=RANK_COLORS[o.rank]||'#94a3b8';
      const rv=parseInt(hex.slice(1,3),16),gv=parseInt(hex.slice(3,5),16),bv=parseInt(hex.slice(5,7),16);
      const tc=(rv*0.299+gv*0.587+bv*0.114)/255>0.55?'#1a2d3d':'#fff';
      return`<span style="display:inline-block;background:${hex};color:${tc};padding:2px 11px;border-radius:14px;font-size:.78rem;font-weight:600;white-space:nowrap">${o.name}</span>`;
    }

    function loadBoard(ds){
      document.getElementById('board').className='loading';
      document.getElementById('board').textContent='Loading…';
      document.getElementById('officer-section').innerHTML='';
      google.script.run
        .withSuccessHandler(renderBoard)
        .withFailureHandler(()=>{document.getElementById('board').innerHTML='<div class="empty">Failed to load assignments.</div>';})
        .getBoardData(ds);
    }

    function renderBoard(data){
      if(data.rankColors) RANK_COLORS=data.rankColors;
      const label=fmtDate(data.date);
      document.title='Beach Assignments — '+label;
      document.getElementById('title').textContent='🏖 Beach Assignments: '+label;

      const offEl=document.getElementById('officer-section');
      offEl.innerHTML=data.officers&&data.officers.length
        ?`<div class="officer-card">
            <div class="officer-label" style="margin-bottom:7px">Officer${data.officers.length!==1?'s':''}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${data.officers.map(rankChip).join('')}</div>
          </div>`
        :'';

      const el=document.getElementById('board');
      el.className='';
      if(!data.posts||!data.posts.length){
        el.innerHTML='<div class="empty">No assignments for this date.</div>';
        return;
      }
      el.innerHTML='<div class="posts-grid">'+data.posts.map(p=>{
        const tc=textColor(p.color);
        return`<div class="post-card" style="background:${p.color}">
          <div class="post-name" style="color:${tc}">${p.name}</div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:center">${p.guards.map(guardChip).join('')}</div>
        </div>`;
      }).join('')+'</div>';
    }

    const dp=document.getElementById('dp');
    dp.value=today();
    loadBoard(today());
    setInterval(()=>loadBoard(dp.value),5*60*1000);
  </script>
</body>
</html>
